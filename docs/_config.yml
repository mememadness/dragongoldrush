title: Dragon Gold Rush Guides
description: Player guides and roadmap for Dragon Gold Rush
url: "https://mememadness.github.io"
baseurl: "/dragongoldrush"

# Pinned to a release tag so upstream theme changes never move the design
# under us. Bump deliberately.
remote_theme: just-the-docs/just-the-docs@v0.10.1

# just-the-docs is a docs theme with a left sidebar, driven by each page's
# front matter (title, nav_order). Both plugins ship with the github-pages
# gem used by actions/jekyll-build-pages, so no Gemfile is needed.
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

color_scheme: dragon
logo: "/assets/images/logo.webp"

search_enabled: true
search:
  heading_level: 2
  button: false

aux_links:
  "Play Dragon Gold Rush ▶":
    - "https://dragon.mememadness.xyz/"
aux_links_new_tab: true

heading_anchors: true

callouts_level: loud
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Coming soon
    color: yellow

footer_content: "Dragon Gold Rush — a match-3 treasure hunt on Nervos CKB."

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
